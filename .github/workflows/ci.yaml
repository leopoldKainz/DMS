name: CI

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

jobs:
  build-and-test-backend:
    name: Build & Test Backend
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          dotnet-quality: 'preview'

      - name: Restore dependencies
        run: dotnet restore DMS.slnx

      - name: Check code formatting (Lint)
        run: dotnet format DMS.slnx --verify-no-changes

      - name: Build solution
        run: dotnet build DMS.slnx --no-restore --configuration Release

      - name: Run tests
        run: dotnet test DMS.slnx --no-build --configuration Release --verbosity normal

  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./DMS.Web
    
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: ./DMS.Web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint React app
        run: npm run lint

      - name: Build React app
        run: npm run build
      
      # TODO: Add test step for frontend when tests are implemented
      # - name: Run tests
      #   run: npm test -- --watchAll=false
  
  ci-complete:
    needs: [ build-and-test-backend, build-frontend ]
    runs-on: ubuntu-latest
    steps:
      - run: echo "All checks passed!"