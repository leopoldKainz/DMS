name: CI

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore DMS.sln

      - name: Build solution
        run: dotnet build DMS.sln --no-restore --configuration Release

      - name: Run tests
        run: dotnet test DMS.sln --no-build --configuration Release --verbosity normal