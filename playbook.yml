- name: Setup Ubuntu Server and Deploy DMS
  hosts: all
  become: yes
  tasks:
    - name: Install required system packages
      apt:
        name: [apt-transport-https, ca-certificates, curl, software-properties-common]
        state: present
        update_cache: yes

    - name: Install Docker and Docker Compose plugin
      apt:
        name: [ docker.io, docker-compose-v2 ]
        state: present

    - name: Ensure Docker service is running
      systemd:
        name: docker
        state: started
        enabled: yes

    - name: Create application directory
      file:
        path: /opt/DMS
        state: directory

    - name: Copy deployment files to server
      copy:
        src: "{{ item }}"
        dest: /opt/DMS/
      loop:
        - ./docker-compose.yml
        - ./.env
        - ./drawSQL-pgsql-export-2026-09-24.sql

    - name: Pull latest image and start Docker Compose
      command: docker compose up -d --pull always
      args:
        chdir: /opt/DMS/